<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemin 2027</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --map:#e8e8e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --map:#222; }
  }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg);
         margin:0 auto; padding:16px; max-width:480px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  #map, #legmap { height:300px; margin:16px 0; border-radius:8px; background:var(--map); }
  .tabs { display:flex; gap:8px; margin-top:12px; }
  .tabs button { flex:1; padding:8px; font:inherit; color:var(--fg); background:transparent;
                 border:1px solid var(--muted); border-radius:8px; }
  .tabs button[aria-selected="true"] { background:var(--fg); color:var(--bg); }
  #legs button { display:block; width:100%; text-align:left; margin:0 0 8px; padding:10px;
                 font:inherit; color:var(--fg); background:transparent;
                 border:1px solid var(--muted); border-left-width:6px; border-radius:8px; }
  #legs button:disabled { opacity:.5; }
  #legs button[aria-pressed="true"] { background:var(--map); }
  #legs small { display:block; color:var(--muted); }
  ul { list-style:none; padding:0; }
  li { padding:8px 0; border-bottom:1px solid var(--muted); }
  li small { display:block; color:var(--muted); }
</style>
</head>
<body>
<h1 id="title">🐚 Chemin</h1>
<div class="muted" id="desc"></div>
<div role="tablist" class="tabs">
  <button role="tab" data-tab="map" aria-selected="true">Trajet</button>
  <button role="tab" data-tab="legs" aria-selected="false">Tronçons</button>
</div>
<section class="panel" id="tab-map">
  <div id="map"></div>
  <ul id="wpts"></ul>
</section>
<section class="panel" id="tab-legs" hidden>
  <div id="legmap"></div>
  <div id="legs"></div>
</section>
<div class="muted" id="stats"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async () => {
  const text = (el, tag) => {
    const n = el.getElementsByTagName(tag)[0];
    return n ? n.textContent : "";
  };
  try {
    const res = await fetch("camino.gpx");
    const xml = new DOMParser().parseFromString(await res.text(), "application/xml");

    const name = text(xml, "name");
    document.title = name;
    document.getElementById("title").textContent = "🐚 " + name;
    document.getElementById("desc").textContent =
      text(xml.getElementsByTagName("metadata")[0], "desc");

    const track = [...xml.getElementsByTagName("trkpt")]
      .map(p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
    const wpts = [...xml.getElementsByTagName("wpt")];

    const mkMap = id => {
      const m = L.map(id);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap"
      }).addTo(m);
      return m;
    };
    const map = mkMap("map");        // onglet Trajet : vue d'ensemble
    const legMap = mkMap("legmap");  // onglet Tronçons : exploration d'un tronçon

    const showTab = id => {
      document.querySelectorAll("[data-tab]").forEach(b =>
        b.setAttribute("aria-selected", b.dataset.tab === id));
      document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "tab-" + id);
      if (id === "map") map.invalidateSize();
      if (id === "legs") { legMap.invalidateSize(); focusLeg(); }
    };
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));

    const colors = ["#d4a000", "#2a7de1", "#c0392b", "#2e8b57"];
    const fmt = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "?";
    const km = pts => pts.reduce((s, p, i) => i ? s + map.distance(pts[i - 1], p) : 0, 0) / 1000;

    // Un <trk> du GPX = un tronçon ; un <trk> sans point = tronçon à venir
    const legs = [...xml.getElementsByTagName("trk")].map((t, i) => {
      const trkpts = [...t.getElementsByTagName("trkpt")];
      const pts = trkpts.map(p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
      const times = trkpts.map(p => text(p, "time")).filter(Boolean);
      const color = colors[i % colors.length];
      const line = pts.length ? L.polyline(pts, { color, weight: 4 }).addTo(map) : null;
      const line2 = pts.length ? L.polyline(pts, { color, weight: 3, opacity: 0.35 }).addTo(legMap) : null;
      return { name: text(t, "name") || "Tronçon " + (i + 1), pts, line, line2, color,
               from: times[0], to: times[times.length - 1], km: km(pts) };
    });
    const drawn = legs.filter(l => l.line);

    const legsEl = document.getElementById("legs");
    let selected = drawn[0] || null;
    const focusLeg = () => {
      legs.forEach(o => o.btn && o.btn.setAttribute("aria-pressed", o === selected));
      if (!selected) return;
      // fitBounds d'abord : Leaflet n'ajoute les tracés au DOM qu'une fois la vue définie
      legMap.fitBounds(selected.line2.getBounds(), { padding: [30, 30] });
      drawn.forEach(o => o.line2.setStyle(
        o === selected ? { weight: 6, opacity: 1 } : { weight: 3, opacity: 0.35 }));
      selected.line2.bringToFront();
    };
    legs.forEach(l => {
      const b = document.createElement("button");
      b.style.borderLeftColor = l.color;
      const h = document.createElement("strong");
      h.textContent = l.name;
      const s = document.createElement("small");
      s.textContent = l.line
        ? fmt(l.from) + " → " + fmt(l.to) + " · " + l.km.toFixed(1) + " km · " + l.pts.length + " points"
        : "À venir";
      b.append(h, s);
      if (l.line) {
        b.onclick = () => {
          selected = l;
          focusLeg();
          document.getElementById("legmap").scrollIntoView({ behavior: "smooth", block: "nearest" });
        };
      } else {
        b.disabled = true;
      }
      l.btn = b;
      legsEl.appendChild(b);
    });
    const ul = document.getElementById("wpts");
    wpts.forEach(w => {
      const n = text(w, "name"), d = text(w, "desc");
      L.marker([+w.getAttribute("lat"), +w.getAttribute("lon")])
        .addTo(map).bindPopup(
          Object.assign(document.createElement("div"), { textContent: n + (d ? " – " + d : "") }));
      const li = document.createElement("li");
      li.textContent = n;
      const s = document.createElement("small");
      s.textContent = d;
      li.appendChild(s);
      ul.appendChild(li);
    });
    if (drawn.length) {
      map.fitBounds(L.featureGroup(drawn.map(l => l.line)).getBounds(), { padding: [20, 20] });
    }

    const t0 = text(xml.getElementsByTagName("trkpt")[0], "time").slice(0, 10);
    document.getElementById("stats").textContent =
      "Début : " + t0 + " · " + track.length + " points";
  } catch (e) {
    document.getElementById("desc").textContent = "Erreur de chargement : " + e.message;
  }
})();
</script>
</body>
</html>
